<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login WiFi</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;font:16px system-ui,sans-serif;color:#ece9ff;background:radial-gradient(800px 500px at 0 0,#2a1763,transparent 60%),radial-gradient(700px 400px at 100% 100%,#10256b,transparent 55%),#07060d}
.c{width:100%;max-width:360px;background:#12101f;border:1px solid #2a2450;border-radius:18px;padding:26px;text-align:center}
h1{margin:0 0 4px;font-size:22px;background:linear-gradient(90deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}p{margin:0 0 18px;color:#9a94c4;font-size:14px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a2450;background:#0b0a16;color:#ece9ff;font:700 20px ui-monospace,monospace;text-align:center;letter-spacing:2px}input:focus{outline:2px solid #8b5cf6}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;color:#fff;font:700 16px system-ui;background:linear-gradient(90deg,#6d28d9,#3b82f6)}.e{margin-top:12px;color:#f87171;font-size:14px}</style></head>
<body><div class="c"><h1>📶 WiFi Voucher</h1><p>Masukkan kode voucher Anda</p>
<form name="login" action="$(link-login-only)" method="post" onsubmit="document.login.password.value=document.login.username.value">
<input type="hidden" name="dst" value="$(link-orig)"><input type="hidden" name="popup" value="true"><input type="hidden" name="password" value="">
<input name="username" value="$(username)" placeholder="KODE" autocomplete="off" autocapitalize="off" required><button type="submit">Hubungkan</button></form>
$(if error)<div class="e">$(error)</div>$(endif)</div></body></html>
